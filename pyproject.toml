[project]
name = "banking"
version = "0.1.0"
description = "DCI (Data, Context, Interaction) in Python: roles injected into live objects for the duration of a context, and the four places where the language says no."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "pytest-bdd",
    "factory-boy",
    "faker",
    # Not for building anything -- these are the libraries people actually
    # write domain objects with, and tests/integration/test_orm_roles.py
    # measures whether role binding survives them. See that file.
    "sqlalchemy",
    "pydantic",
    "attrs",
    "ruff",
    "pyright",
    "pyrefly",
    "bandit[toml]",
    "pip-audit",
    "pre-commit",
]
deploy = [
    "docker",
]
# The notebooks in the browser (JupyterLite) and on the desktop (nbclient).
# The kernel is bounded to 0.8.x because that is the line built on Pyodide
# 314, which is CPython 3.14; `requires-python` refuses anything older, and
# the browser runtime has to be the same Python the repository measures.
lite = [
    "jupyterlite-core>=0.8,<0.9",
    "jupyterlite-pyodide-kernel>=0.8,<0.9",
    "jupyter-server",  # without it, `jupyter lite build` copies the contents but does not index them
    "nbclient",
    "ipykernel",
    "nbstripout",
    "pytest-playwright",  # tests/e2e: the built site, driven in a real browser
]
