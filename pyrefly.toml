# Second type checker, run alongside pyright on purpose -- not a migration.
# Two different inference engines over the same code tend to catch different
# things, which matters more than usual here: the whole point of this repo is
# code the type checker can only partly see (roles are mixed into a class that
# is synthesized at runtime). There are no suppressions anywhere in the repo,
# which is the standard this file is here to hold: both checkers must report
# 0 errors and 0 suppressed. Where a checker cannot see a runtime fact, the
# answer is a commented `typing.cast` naming the fact -- `RoleClass` for the
# synthesized class, the role class itself for an object currently playing it.
#
# pyrefly is young and its config schema evolves -- check
# https://pyrefly.org/ for the current keys before relying on this file.

project-includes = ["src", "tests", "demo"]
python-version = "3.14"
