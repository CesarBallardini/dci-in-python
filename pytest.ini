; pytest configuration. Kept here rather than in `pyproject.toml` so that the
; test settings live in the file pytest looks for first and reads as its own.
[pytest]
addopts = -ra --strict-markers -m 'not snapshot and not e2e'
testpaths = tests

; `e2e` tests drive the JupyterLite site in a real browser. They need the site
; built and Playwright's browsers installed, so the default run deselects them;
; `make test-e2e` provides both and selects them with `-m e2e`, which replaces
; the `-m` above.
;
; The last three markers name a capability a WebAssembly runtime may lack.
; `tests/conftest.py` skips a marked test where that capability is missing, so
; on the desktop they change nothing. Pyodide has no threads and no processes,
; and drives an event loop from synchronous code only where the JavaScript
; engine supports JSPI. A run started from a desktop notebook cell is inside
; the kernel's event loop already, so it skips the `event_loop` tests too.
markers =
    unit: fast tests with no external dependencies
    integration: tests that need a real database or service
    bdd: behavior-driven acceptance tests (pytest-bdd, Gherkin)
    snapshot: snapshot tests, excluded by default, run on demand
    e2e: the built JupyterLite site, driven in a real browser by Playwright; excluded by default
    threads: starts OS threads; skipped where the runtime cannot start one
    subprocess: starts a second interpreter; skipped where the runtime has no processes
    event_loop: runs an asyncio event loop from synchronous code; skipped where that cannot block, or a loop is already running

; `gherkin-official` 29.0.0 calls `re.split(pattern, text, 2)`, and passing
; `maxsplit` positionally is deprecated. It sits on the parsing path of every
; `.feature` file, so it fires once per feature and says nothing about this
; repository. Scoped to that one message in that one module rather than to
; `DeprecationWarning` at large, so a deprecation in code that is ours still
; surfaces. Remove it once the dependency stops doing this.
filterwarnings =
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin.gherkin_line
